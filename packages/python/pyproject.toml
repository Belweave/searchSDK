[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searchsdk"
version = "0.1.0a0"
description = "Multi-provider search and explicit provider-native clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Belweave"}]
keywords = ["search", "sdk"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Typing :: Typed"]
dependencies = []

[project.urls]
Homepage = "https://searchsdk.dev"
Repository = "https://github.com/Belweave/searchSDK"
Issues = "https://github.com/Belweave/searchSDK/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
searchsdk = ["py.typed", "catalog.json"]

[tool.ruff]
cache-dir = ".build/ruff-cache"
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]

[tool.ruff.format]
exclude = ["src/searchsdk/native_clients.py", "src/searchsdk/native_types.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B023", "E731"]
