name: Feature or provider request
description: Suggest an improvement with a concrete use case.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the outcome and the limitation you encounter today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a small API example or relevant official provider documentation. Omit credentials and private data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Describe existing workarounds and any compatibility or billing considerations.
