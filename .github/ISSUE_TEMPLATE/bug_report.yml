name: Bug report
description: Report a reproducible SDK or documentation problem.
body:
  - type: markdown
    attributes:
      value: |
        For security issues, use the security reporting link instead.
        Use synthetic data. Do not include API keys, private queries, raw account responses, or personal paths.
  - type: input
    id: version
    attributes:
      label: SDK version or commit
      description: The package and version (for example @searchsdk/sdk@0.1.0), or the commit for a source checkout.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and environment
      description: Node or Python version, operating system, and the provider involved.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Prefer an injected fetch or transport with a synthetic body that reproduces the issue without credentials.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include sanitized error codes and attempt outcomes when relevant.
    validations:
      required: true
