name: v2 registry and runtimes

on:
  push:
    paths:
      - registry/**
      - sdk/typescript/**
      - sdk/python/**
      - .github/workflows/v2.yml
  pull_request:
    paths:
      - registry/**
      - sdk/typescript/**
      - sdk/python/**
      - .github/workflows/v2.yml

permissions:
  contents: read

concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: Registry vectors and TypeScript runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Synthetic vectors with an injected fetch only: no secrets, no provider calls.
      - name: Registry sync check, typecheck and all tests
        run: npm test
      - name: Build the package
        run: npm run build

  python:
    name: Registry vectors and Python runtime (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned type checker
        run: python -m pip install --no-cache-dir -r requirements-dev.txt
      # Synthetic vectors with an injected transport only: no secrets, no provider calls.
      - name: Registry sync check, mypy --strict and all tests
        run: python scripts/check.py
      - name: Build the wheel and import it in a clean environment
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --no-index "$RUNNER_TEMP"/dist/searchsdk-*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/clean/bin/python" -c "import searchsdk; assert sorted(searchsdk.registry) and searchsdk.Client"
