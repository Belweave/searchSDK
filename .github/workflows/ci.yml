name: CI

# Every job uses synthetic fixtures, an injected transport or loopback only.
# No secrets are configured, no provider or judge is called, nothing is
# published or deployed.

on:
  push:
    branches: [main, "v2/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    name: Public-tree guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Fails on forbidden paths (.env, .local, keys) and high-confidence
      # credential or personal-path patterns in tracked files.
      - name: No forbidden paths or credential patterns
        run: node scripts/verify-public-tree.mjs

  registry:
    name: Registry embedded in both runtimes and the README
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Both runtimes embed registry/; each check fails if its copy is stale.
      - name: TypeScript embedded registry is current
        run: node sdk/typescript/scripts/sync-registry.mjs --check
      - name: Python embedded registry is current
        run: python sdk/python/scripts/sync_registry.py --check
      - name: README provider table matches the registry
        run: node scripts/readme-providers.mjs --check

  brand:
    name: Brand exports and rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: brand
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Regenerates every SVG, PNG, ICO, token file and the guidelines page in memory and fails if a
      # committed file differs; checks colour, contrast, name, banned words and word caps. No network.
      - name: Exports current, colours, contrast and copy rules
        run: npm run check

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Synthetic vectors with an injected fetch only: no secrets, no provider calls.
      - name: Registry sync check, typecheck and all tests
        run: npm test
      - name: Build the package
        run: npm run build

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned type checker
        run: python -m pip install --no-cache-dir -r requirements-dev.txt
      # Synthetic vectors with an injected transport only: no secrets, no provider calls.
      - name: Registry sync check, mypy --strict and all tests
        run: python scripts/check.py
      - name: Build the wheel and import it in a clean environment
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --no-index "$RUNNER_TEMP"/dist/searchsdk-*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/clean/bin/python" -c "import searchsdk; assert sorted(searchsdk.registry) and searchsdk.Client"

  bench:
    name: Benchmark harness on fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bench
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Synthetic providers, a synthetic judge and a local fixture web only: no
      # secrets, no provider or judge calls. A guard fails any network use in
      # tests, and the CLI refuses live runs whenever CI is set.
      - name: Typecheck, tests, dataset validation and the pilot dry-run plan
        run: npm run check

  site:
    name: Site build, examples and crawl
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      # Reads ../registry, typechecks examples against ../sdk/typescript and
      # fails if the site's copies of ../brand (tokens, fonts, marks, icons)
      # are stale; the crawl serves the built site on loopback and checks the
      # brand rules. No secrets, no provider calls.
      - name: Brand copies, typecheck, examples, tokens, build and crawl
        run: npm run check
